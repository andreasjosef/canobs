[project]
name = "canobs"
version = "0.1.0"
description = "Turn Canvas course pages into markdown notes in Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "markdownify>=1.2.3",
    "questionary>=2.1.1",
]

[project.scripts]
canobs = "canobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
